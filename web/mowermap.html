<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mower log map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; font: 13px/1.4 system-ui, sans-serif; background: #14171a; color: #e6e6e6; }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #map { flex: 1; min-height: 0; background: #14171a; }

  /* ---- graph strip along the bottom quarter of the window ---- */
  #chart {
    height: 25%; flex: none; display: flex; flex-direction: column; position: relative;
    padding: 6px 8px 4px; background: #181b1f; border-top: 1px solid #2b3238;
  }

  /* Handles on the graph edges, extending the window into the past and future. */
  #earlier, #later {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 5;
    width: 20px; height: 64px; padding: 0; font-size: 16px; line-height: 1;
  }
  #earlier { left: 0; border-left: none; border-radius: 0 5px 5px 0; }
  #later { right: 0; border-right: none; border-radius: 5px 0 0 5px; }

  /* touch-action: a finger drag on the graph is a zoom selection, not a page gesture. */
  #chartCanvas { flex: 1; min-height: 0; width: 100%; display: block; cursor: crosshair; touch-action: none; }

  section { padding: 10px; border-bottom: 1px solid #2b3238; }
  section.grow { flex: 1; min-height: 0; overflow-y: auto; border-bottom: none; }
  h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .04em; text-transform: uppercase; color: #9aa4ae; }
  h2 { font-size: 11px; margin: 0 0 6px; letter-spacing: .06em; text-transform: uppercase; color: #78828c; }

  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  input[type=text], select, button {
    background: #22262b; color: #e6e6e6; border: 1px solid #3a424b;
    border-radius: 4px; padding: 5px 6px; font: inherit;
  }
  input[type=text] { flex: 1; min-width: 0; }
  select { width: 100%; }
  button { cursor: pointer; white-space: nowrap; }
  button:hover { background: #2c323a; }
  button:disabled { color: #5a636c; border-color: #2b3238; cursor: default; }
  button:disabled:hover { background: #22262b; }
  button.on { background: #23303a; border-color: #4cc9f0; color: #4cc9f0; }
  button.wait { border-color: #f9c74f; color: #f9c74f; }
  input[type=range] { width: 100%; }

  #loaded { color: #78828c; font-size: 11px; }

  #busy {
    width: 12px; height: 12px; flex: none; border-radius: 50%;
    border: 2px solid #3a424b; border-top-color: #4cc9f0;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- workorder picker ---- */
  #woSent { color: #78828c; font-size: 11px; min-height: 1.4em; }
  #woDialog {
    background: #181b1f; color: #e6e6e6; border: 1px solid #3a424b; border-radius: 6px;
    padding: 10px; min-width: 240px; font: inherit;
  }
  #woDialog::backdrop { background: rgba(0, 0, 0, .5); }
  #woList { list-style: none; margin: 0 0 8px; padding: 0; max-height: 50vh; overflow-y: auto; }
  #woList li { padding: 5px 6px; border-radius: 4px; cursor: pointer; user-select: none; }
  #woList li:hover { background: #22262b; }
  #woList li.none { color: #78828c; cursor: default; }
  #woList li.none:hover { background: none; }

  #status { color: #ff8080; font-size: 11px; }
  /* Top right: the sample the cursor sits on, then the button column. */
  .menu { display: flex; align-items: flex-start; gap: 6px; }
  .menu .stack { display: flex; flex-direction: column; }
  #sample {
    min-width: 160px; padding: 6px 8px; font-size: 12px; font-variant-numeric: tabular-nums;
    background: rgba(34, 38, 43, .9); border: 1px solid #2b3238; border-radius: 4px;
  }
  #sample div { display: flex; justify-content: space-between; gap: 10px; }
  #sample span { color: #9aa4ae; }

  /* The map toolbar, top right: the menu button and the mower commands. */
  .menu .tools { display: flex; gap: 2px; }
  .menu .tools button, .menu #menuBtn {
    width: 30px; height: 30px; padding: 0; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .menu #menuBtn { align-self: flex-end; }   /* the box grows leftwards, the button stays put */
  .menu #woSent, .menu #status { margin-top: 4px; max-width: 170px; text-align: right; }

  /* The menu button and whatever it has open share one box. */
  .menu .box {
    display: flex; flex-direction: column; padding: 2px;
    background: #22262b; border: 1px solid #2b3238; border-radius: 4px;
  }
  .menu .box button { border: none; background: none; text-align: left; }
  .menu .box button:hover { background: #2c323a; }
  .menu .panel { display: flex; flex-direction: column; }

  /* The stock layer control is the menu's Layers panel: no box of its own. */
  .menu .leaflet-control-layers {
    margin: 0; padding: 4px 6px; background: none; border: none;
    box-shadow: none; color: #e6e6e6;
  }

  /* The line colour key, floating over the bottom left corner of the map. */
  #legend {
    padding: 6px 8px; min-width: 120px; max-height: 40vh; overflow-y: auto;
    background: rgba(34, 38, 43, .9); border: 1px solid #2b3238; border-radius: 4px;
    color: #e6e6e6; font-size: 11px;
  }
  #legend .key { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
  #legend .key:last-child { margin-bottom: 0; }
  #legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
  .hidden { display: none !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #22262b; color: #e6e6e6; }
  .leaflet-popup-content { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<dialog id="woDialog">
  <h2>Select workorder</h2>
  <ul id="woList"></ul>
  <button id="woCancel">Cancel</button>
</dialog>

<div id="main">
  <div id="map"></div>
  <div id="chart">
    <button id="earlier" title="Extend the window further back in time">&laquo;</button>
    <button id="later" title="Extend the window further forward in time">&raquo;</button>
    <canvas id="chartCanvas"></canvas>
  </div>
</div>

<script>
"use strict";

/* -------------------------------------------------------- remembered ----- */
/* Kept in localStorage, so it is per browser and per host. Logs picked with
   Load file… are left out: the browser will not re-read a local file unasked. */

const STORE_KEY = "mowermap.v1";

const STATE = (() => {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
})();

function saveState() {
  const state = {
    known: OVERLAYS.map(o => o.name),
    layers: OVERLAYS.filter(o => map.hasLayer(o.layer)).map(o => o.name),
    span: viewRange.t1 - viewRange.t0,
    colorBy: colorMode,
    channel: graphChannel
  };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { /* blocked or full */ }
}

/* ---------------------------------------------------------------- map ---- */

/* Zoom past what the imagery supports: the tiles just get upscaled, but the
   canvas-drawn track stays sharp, which is the point at centimetre scale.
   Half-steps so the last few levels are not a huge jump. */
const MAX_ZOOM = 26;

/* keyboard off: the arrow keys step the scrub cursor, they do not pan the map. */
const map = L.map("map", {
  preferCanvas: true, maxZoom: MAX_ZOOM, zoomSnap: 0.5, zoomDelta: 0.5,
  wheelPxPerZoomLevel: 120, keyboard: false
}).setView([60.574, 15.631], 18);

const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: MAX_ZOOM, maxNativeZoom: 19, attribution: "&copy; OpenStreetMap contributors"
});
/* Esri has no imagery past z18 over this lawn — asking for more just returns a
   "map data not yet available" placeholder, so upscale z18 instead. */
const sat = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: MAX_ZOOM, maxNativeZoom: 18, attribution: "Imagery &copy; Esri"
});
/* ---------------------------------------------------------------- menu -- */
/* One button on the map lists what there is to open; picking an item closes the
   list and opens that item's panel under the button. */

const COLOR_MODES = [["state", "Mower state"], ["battery", "Battery SoC"], ["near_wire", "Near wire"],
                     ["wire", "Wire sensors"], ["hdop", "HDOP"], ["sats", "Satellites used"],
                     ["wifi", "Wifi signal"], ["fix", "Fix quality"], ["time", "Time"]];

let colorMode = COLOR_MODES.some(m => m[0] === STATE.colorBy) ? STATE.colorBy : "state";

const menuControl = L.control({ position: "topright" });

menuControl.onAdd = () => {
  const div = L.DomUtil.create("div", "menu");

  div.innerHTML = '<div class="tools">' +
                    '<button id="abort" title="Abort the running workorder">&#9632;</button>' +
                    '<button id="workorder" title="Start a workorder on the mower">&#9654;</button>' +
                    '<button id="live" title="Append live samples to the shown file">&#9679;</button>' +
                  '</div>' +
                  '<div id="sample" class="hidden"></div>' +
                  '<div class="stack">' +
                    '<div class="box">' +
                      '<button id="menuBtn" title="Menu">&#9776;</button>' +
                      '<div id="menuList" class="panel hidden"></div>' +
                      '<div id="colorPanel" class="panel hidden"></div>' +
                      '<div id="channelPanel" class="panel hidden"></div>' +
                    '</div>' +
                    '<div id="woSent"></div>' +
                    '<div id="busy" class="hidden" title="Loading worklogs"></div>' +
                    '<div id="status" class="hidden"></div>' +
                  '</div>';
  L.DomEvent.disableClickPropagation(div);
  return div;
};
menuControl.addTo(map);

/* All layers are overlays, not base layers, so every one is a checkbox and the
   imagery can be switched off entirely. The control is the menu's Layers panel:
   always expanded, and hidden until the menu opens it. */
const layerControl = L.control.layers(null, null, { position: "topright", collapsed: false }).addTo(map);

layerControl.getContainer().classList.add("hidden");
document.querySelector(".menu .box").appendChild(layerControl.getContainer());   /* one box for every panel */

L.control.scale({ imperial: false }).addTo(map);

/* The key for the line colour, floating over the map rather than in the column. */
const legendControl = L.control({ position: "bottomleft" });

legendControl.onAdd = () => {
  const div = L.DomUtil.create("div");

  div.id = "legend";
  div.classList.add("hidden");
  return div;
};
legendControl.addTo(map);

const OVERLAYS = [];   /* {name, layer} for every checkbox in the control */

/* `show` is only the default: once the browser has seen a layer, the remembered
   tick wins, so a newly added layer can still arrive switched on. */
function addOverlay(layer, name, show) {
  OVERLAYS.push({ name, layer });
  layerControl.addOverlay(layer, name);
  const known = (STATE.known || []).includes(name);
  if (known ? (STATE.layers || []).includes(name) : show) layer.addTo(map);
}

addOverlay(sat, "Satellite", true);
addOverlay(osm, "OpenStreetMap", false);

map.on("overlayadd overlayremove", saveState);

const trackLayer  = L.layerGroup().addTo(map);   /* the coloured paths       */
const eventLayer  = L.layerGroup().addTo(map);   /* bump / lift markers      */
const markerLayer = L.layerGroup().addTo(map);   /* start, end, scrub cursor */

/* ------------------------------------------------------ log file parsing -- */
/* Format per logformat.txt. Rows starting with # are ignored, an empty field
   means the value was not known. v2 rows start with the fieldtype, v1 rows
   start with the timestamp, so the first field tells the two apart. */

const V1 = { iso: 0, lat: 1, ns: 2, lon: 3, ew: 4, fix_quality: 5, fix_mode: 6, sats: 7, hdop: 8,
             state: 9, soc: 10, bump: 11, lift: 12, wire_right: 13, wire_left: 14, near_wire: 15 };
const V2 = { iso: 1, lat: 2, ns: 3, lon: 4, ew: 5, fix_quality: 6, sats: 7, hdop: 8, wifi: 9,
             state: 10, soc: 11, bump: 12, lift: 13, wire_right: 14, wire_left: 15, near_wire: 16 };

/* NMEA ddmm.mmmmm / dddmm.mmmmm -> signed decimal degrees. */
function nmeaToDeg(value, hemisphere) {
  const v = parseFloat(value);
  if (!isFinite(v)) return NaN;
  const deg = Math.floor(v / 100);
  const dec = deg + (v - deg * 100) / 60;
  const h = (hemisphere || "").trim().toUpperCase();
  return (h === "S" || h === "W") ? -dec : dec;
}

const num = s => (s === undefined || s.trim() === "") ? null : Number(s);

function parseCsv(text) {
  const rows = [];
  let skipped = 0;
  let volt = null, current = null;   /* fieldtype 2, carried onto the rows that follow */

  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (line === "" || line.startsWith("#")) continue;

    const f = line.split(",");
    if (f[0] === "2" && f.length >= 4) { volt = num(f[2]); current = num(f[3]); continue; }
    if (/^[0-9]{1,3}$/.test(f[0]) && f[0] !== "1") continue;   /* v2 fieldtype we do not read */

    const c = f[0] === "1" ? V2 : V1;
    if (f.length < (c === V2 ? 17 : 16)) { skipped++; continue; }

    const lat = nmeaToDeg(f[c.lat], f[c.ns]);
    const lon = nmeaToDeg(f[c.lon], f[c.ew]);
    if (!isFinite(lat) || !isFinite(lon)) { skipped++; continue; }   /* position unknown */

    const t = Date.parse(f[c.iso]);
    rows.push({
      t: isFinite(t) ? t : null, iso: f[c.iso], lat, lon,
      fix_quality: num(f[c.fix_quality]), fix_mode: num(f[c.fix_mode]), sats: num(f[c.sats]), hdop: num(f[c.hdop]),
      wifi: num(f[c.wifi]), state: num(f[c.state]), soc: num(f[c.soc]), volt, current,
      bump: num(f[c.bump]), lift: num(f[c.lift]),
      wire_right: num(f[c.wire_right]), wire_left: num(f[c.wire_left]), near_wire: num(f[c.near_wire])
    });
  }
  return { rows, skipped };
}

/* --------------------------------------------------------------- colour -- */

/* The firmware also reports states of its own past this list - those are left
   as the bare number rather than guessed at. */
const STATE_NAMES = { 0: "idle", 1: "debug", 2: "menu", 3: "mow", 4: "startcharge", 5: "charging",
                      6: "wait_for_schedule", 7: "stopped", 8: "stopped_2",
                      32: "rc_stopped", 33: "rc_running", 34: "rc_turning", 35: "rc_normal_mow",
                      36: "rc_finding_charge", 37: "rc_charging" };

const stateName = s => s == null ? "?" : (STATE_NAMES[s] || String(s));

const STATE_COLORS = { 0: "#8d99ae", 1: "#4cc9f0", 2: "#4895ef", 3: "#43aa8b", 4: "#90be6d",
                       5: "#f9c74f", 6: "#f8961e", 7: "#f3722c", 8: "#f94144", 9: "#b5179e",
                       32: "#f3722c", 33: "#4cc9f0", 34: "#f9c74f", 35: "#43aa8b",
                       36: "#b5179e", 37: "#90be6d" };
const FIX_COLORS = { 1: "#f9c74f", 2: "#90be6d", 3: "#43aa8b",
                     4: "#4cc9f0", 5: "#4895ef", 6: "#f94144" };
const GREY = "#8d99ae";

/* Blend along a list of hex stops; f in [0,1]. */
function ramp(stops, f) {
  f = Math.max(0, Math.min(1, f));
  const x = f * (stops.length - 1), i = Math.min(Math.floor(x), stops.length - 2), k = x - i;
  const a = parseInt(stops[i].slice(1), 16), b = parseInt(stops[i + 1].slice(1), 16);
  const mix = sh => Math.round((((a >> sh) & 255) * (1 - k)) + (((b >> sh) & 255) * k));
  return "#" + [mix(16), mix(8), mix(0)].map(v => v.toString(16).padStart(2, "0")).join("");
}
const HEAT = ["#f94144", "#f8961e", "#f9c74f", "#90be6d", "#43aa8b"];   /* bad -> good  */
const TIME = ["#4cc9f0", "#4895ef", "#b5179e", "#f94144", "#f9c74f"];   /* early -> late */

function colorFn(mode, rows) {
  const t0 = rows.length ? rows[0].t : 0;
  const t1 = rows.length ? rows[rows.length - 1].t : 0;

  switch (mode) {
    case "state":     return r => r.state == null ? GREY : (STATE_COLORS[r.state] || GREY);
    case "battery":   return r => r.soc == null ? GREY : ramp(HEAT, r.soc / 100);
    case "near_wire": return r => r.near_wire == null ? GREY : (r.near_wire ? "#f94144" : "#43aa8b");
    case "wire":      return r => {
      if (r.wire_left == null || r.wire_right == null) return GREY;
      if (r.wire_left && r.wire_right) return "#43aa8b";   /* both inside     */
      if (!r.wire_left && !r.wire_right) return "#f94144"; /* both outside    */
      return "#f9c74f";                                    /* straddling wire */
    };
    case "hdop":      return r => r.hdop == null ? GREY : ramp(HEAT, 1 - (r.hdop - 0.5) / 2.5);
    case "sats":      return r => r.sats == null ? GREY : ramp(HEAT, (r.sats - 4) / 26);
    case "wifi":      return r => r.wifi == null ? GREY : ramp(HEAT, (r.wifi + 80) / 30);
    case "fix":       return r => FIX_COLORS[r.fix_quality] || GREY;
    case "time":      return r => (t1 > t0 && r.t != null) ? ramp(TIME, (r.t - t0) / (t1 - t0)) : GREY;
    default:          return () => GREY;
  }
}

function legendFor(mode, tracks) {
  const rows = tracks.flatMap(view);
  const keys = pairs => pairs.map(([c, l]) =>
    `<span class="key"><i style="background:${c}"></i>${l}</span>`).join("");
  const gradient = (stops, lo, hi) =>
    `<div style="height:10px;border-radius:3px;background:linear-gradient(90deg,${stops.join(",")})"></div>` +
    `<div style="display:flex;justify-content:space-between;color:#78828c">` +
    `<span>${lo}</span><span>${hi}</span></div>`;

  switch (mode) {
    case "state": {
      const seen = [...new Set(rows.map(r => r.state).filter(s => s != null))].sort((a, b) => a - b);
      return keys(seen.map(s => [STATE_COLORS[s] || GREY, stateName(s)]));
    }
    case "battery":   return gradient(HEAT, "0 %", "100 %");
    case "near_wire": return keys([["#43aa8b", "far from wire"], ["#f94144", "near wire"]]);
    case "wire":      return keys([["#43aa8b", "both inside"], ["#f9c74f", "one outside"],
                                   ["#f94144", "both outside"]]);
    case "hdop":      return gradient([...HEAT].reverse(), "HDOP 0.5", "3.0+");
    case "sats":      return gradient(HEAT, "4 sats", "30 sats");
    case "wifi":      return gradient(HEAT, "-80 dBm", "-50 dBm");
    case "fix": {
      const names = { 1: "GPS", 2: "DGPS", 3: "PPS", 4: "RTK fixed", 5: "RTK float", 6: "dead reckoning" };
      const seen = [...new Set(rows.map(r => r.fix_quality).filter(q => q != null))].sort((a, b) => a - b);
      return keys(seen.map(q => [FIX_COLORS[q] || GREY, names[q] || ("quality " + q)]));
    }
    default:          return "";
  }
}

/* --------------------------------------------------------------- tracks -- */
/* One entry per known log file. rows === null until it has been loaded. */

const TRACKS = [];             /* {key, name, url, file, rows, on} */
let activeKey = null;          /* file the stats box and scrubber follow  */

/* The shown time window, which also decides which log files get loaded.
   Everything downstream — map, stats, scrubber, graph — works off view(). */
const DEFAULT_SPAN_MS = 24 * 3600 * 1000;
let viewRange = { t0: Date.now() - (STATE.span || DEFAULT_SPAN_MS), t1: Date.now() };

const inView = r => r.t != null && r.t >= viewRange.t0 && r.t <= viewRange.t1;
const view = track => track.rows.filter(inView);

/* Set when the next render should jump the cursor to the newest sample. */
let selectEnd = false;

/* Set while the directory listing is in flight; the files have their own flag. */
let listing = false;

const selected = () => TRACKS.filter(t => t.on && t.rows && t.rows.length);

/* When a log starts, from its name, or from its first sample for one picked
   off the disk. */
const trackStart = t => fileStart(t.name) ?? (t.rows && t.rows.length ? t.rows[0].t : 0);

/* Every sample in the window, whatever file it came from, oldest first. The live
   feed overlaps the file it is appended to and files can overlap each other, so
   the rows are sorted and a timestamp already taken is dropped.
   The graph, the scrubber and the stats box all run off this. */
function windowRows() {
  const rows = [];
  const merged = [];

  for (const t of selected()) {
    for (const r of t.rows) {
      if (inView(r)) { rows.push(r); }
    }
  }

  rows.sort((a, b) => a.t - b.t);

  for (const r of rows) {
    if (!merged.length || r.t !== merged[merged.length - 1].t) { merged.push(r); }
  }
  return merged;
}
const byKey = k => TRACKS.find(t => t.key === k);

/* Newest name first, which is the order tracksInWindow() reads them in. */
const listedTracks = () =>
  [...TRACKS].sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }));

function addTrack(t) {
  if (byKey(t.key)) return byKey(t.key);
  t.rows = null;
  t.on = false;
  TRACKS.push(t);
  return t;
}

/* --------------------------------------------------------------- render -- */

const GAP_MS = 10000;   /* longer than this between samples = break the line */

/* Logs are timestamped UTC; every time shown is the browser's local zone. */
const pad2 = n => String(n).padStart(2, "0");
const hhmm   = t => { const d = new Date(t); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const hhmmss = t => `${hhmm(t)}:${pad2(new Date(t).getSeconds())}`;
const stamp  = r => {
  if (r.t == null) return r.iso;
  const d = new Date(r.t);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${hhmmss(r.t)}`;
};

function popupHtml(r, track) {
  return [
    `<b>${track.name}</b>`,
    stamp(r),
    `${r.lat.toFixed(7)}, ${r.lon.toFixed(7)}`,
    `${stateName(r.state)} &middot; battery ${r.soc ?? "?"} %`,
    `fix ${r.fix_quality ?? "?"} / mode ${r.fix_mode ?? "?"} &middot; ${r.sats ?? "?"} sats` +
      ` &middot; HDOP ${r.hdop ?? "?"}`,
    `wire L/R ${r.wire_left ?? "?"}/${r.wire_right ?? "?"} &middot; near ${r.near_wire ?? "?"}` +
      `${r.bump ? " &middot; <b>bump</b>" : ""}${r.lift ? " &middot; <b>lift</b>" : ""}`
  ].join("<br>");
}

function drawTrack(track, rows, mode) {
  const color = colorFn(mode, rows);

  /* One polyline per run of same-coloured samples, so a 10k sample log stays
     a few dozen layers instead of 10k of them. */
  let pts = [rows[0]], cur = color(rows[0]);
  const flush = c => {
    if (pts.length > 1) {
      L.polyline(pts.map(r => [r.lat, r.lon]),
                 { color: c, weight: 3, opacity: .95, lineJoin: "round" }).addTo(trackLayer);
    }
    pts = [];
  };

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i], c = color(r);
    if (r.t != null && rows[i - 1].t != null && r.t - rows[i - 1].t > GAP_MS) {
      flush(cur); pts = [r]; cur = c; continue;
    }
    if (c !== cur) { pts.push(r); flush(cur); pts = [r]; cur = c; }
    else pts.push(r);
  }
  flush(cur);

  /* Bumper hits and lifts are worth seeing wherever they happened. */
  for (const r of rows) {
    if (r.bump) L.circleMarker([r.lat, r.lon], { radius: 5, color: "#f94144", weight: 2, fillOpacity: .6 })
                  .bindPopup(popupHtml(r, track)).addTo(eventLayer);
    if (r.lift) L.circleMarker([r.lat, r.lon], { radius: 5, color: "#b5179e", weight: 2, fillOpacity: .6 })
                  .bindPopup(popupHtml(r, track)).addTo(eventLayer);
  }

  const last = rows[rows.length - 1];
  L.circleMarker([last.lat, last.lon],
    { radius: 7, color: "#fff", weight: 2, fillColor: "#f94144", fillOpacity: 1 })
    .bindPopup("<b>End</b><br>" + popupHtml(last, track)).addTo(markerLayer);
}

let cursorMarker = null;
let fitted = false;   /* the map is fitted to the track once, when the page opens */

function redraw(fit) {
  trackLayer.clearLayers();
  eventLayer.clearLayers();
  markerLayer.clearLayers();
  cursorMarker = null;

  const shown = selected();
  const mode = colorMode;
  const drawn = [];
  for (const t of shown) {
    const rows = view(t);                  /* only the selected time window */
    if (rows.length > 1) { drawTrack(t, rows, mode); drawn.push(rows); }
  }

  const legend = document.getElementById("legend");

  legend.innerHTML = shown.length ? legendFor(mode, shown) : "";
  legend.classList.toggle("hidden", !legend.innerHTML);
  renderBusy();
  renderCursor();

  if (fit && !fitted && drawn.length) {
    /* Cap the auto-fit: a track a few metres long would otherwise slam into
       MAX_ZOOM and show nothing but upscaled tile mush. */
    map.fitBounds(L.latLngBounds(drawn.flat().map(r => [r.lat, r.lon])).pad(0.05),
                  { maxZoom: 20 });
    fitted = true;
  }
}

/* ------------------------------------------------------------ progress -- */

function renderBusy() {
  const pending = TRACKS.filter(t => t.loading).length;

  document.getElementById("busy").classList.toggle("hidden", !pending && !listing);
  liveButton();   /* which file live samples would go to may have just changed */
}

/* The cursor follows the newest sample until the user moves it. */
function renderCursor() {
  const rows = windowRows();

  if (!rows.length) {
    document.getElementById("sample").classList.add("hidden");
    drawChart();
    return;
  }

  if (selectEnd || chartIndex > rows.length - 1) { chartIndex = rows.length - 1; }
  selectEnd = false;
  updateCursor(chartIndex);
}

function updateCursor(i) {
  const r = windowRows()[i];
  if (!r) return;
  chartIndex = i;
  drawChart();
  if (cursorMarker) markerLayer.removeLayer(cursorMarker);
  cursorMarker = L.circleMarker([r.lat, r.lon],
    { radius: 6, color: "#fff", weight: 2, fillColor: "#4cc9f0", fillOpacity: 1 }).addTo(markerLayer);

  const line = (k, v) => `<div><span>${k}</span><b>${v}</b></div>`;
  const box = document.getElementById("sample");

  box.innerHTML = line("Time", stamp(r)) + line("SoC", `${r.soc ?? "?"} %`) + line("State", stateName(r.state));
  box.classList.remove("hidden");
}

/* ---------------------------------------------------------------- graph -- */
/* Time on x, one channel on y, for every sample in the window. */

const CHANNELS = {
  soc:   { label: "Battery SoC", unit: " %", lo: 0, hi: 100, get: r => r.soc },
  sats:  { label: "Satellites",  unit: "",   lo: 0,          get: r => r.sats },
  hdop:  { label: "HDOP",        unit: "",   lo: 0,          get: r => r.hdop },
  wifi:  { label: "Wifi signal", unit: " dBm", lo: -100, hi: 0, get: r => r.wifi },
  volt:    { label: "Battery voltage", unit: " V", get: r => r.volt },
  current: { label: "Charge current", unit: " A", lo: 0, get: r => r.current },
  state: { label: "State",       unit: "",   lo: 0, tick: 1, get: r => r.state, text: stateName }
};

let graphChannel = CHANNELS[STATE.channel] ? STATE.channel : "soc";

/* The end labels are aligned inwards, so r only keeps the axis off the edge. */
const PAD = { l: 42, r: 8, t: 8, b: 18 };

const chartCanvas = document.getElementById("chartCanvas");
let chartIndex = 0;         /* row index the scrub cursor sits on       */
let chartPts   = [];        /* {x, y, i} in canvas pixels, for hit test */
let chartGeom  = null;      /* {x0, x1, y0, y1, t0, t1} pixels <-> time */
let brush      = null;      /* {from, to} canvas x while dragging       */

/* Zoomed in far enough that whole minutes would repeat? Then show seconds. */
const SHORT_SPAN = 20 * 60000;
const clock = (t, span) => span < SHORT_SPAN ? hhmmss(t) : hhmm(t);

/* Gridlines land on round clock times: whole minutes, quarter hours, whole
   hours, midnight. Steps are the ones a clock is read in, not decimal ones. */
const TICK_STEPS = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200,
                    10800, 21600, 43200, 86400].map(s => s * 1000);
const DAY_MS = 86400000;
const mmdd = t => { const d = new Date(t); return `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };

function tickStep(span, max) {
  for (const s of TICK_STEPS) if (span / s <= max) return s;
  return Math.ceil(span / max / DAY_MS) * DAY_MS;      /* whole days beyond that */
}

/* Aligned in local time, so an hour tick sits on the hour the labels show.
   The offset is taken at t0; a window straddling a DST change drifts an hour. */
function tickTimes(t0, t1, step) {
  const off = new Date(t0).getTimezoneOffset() * 60000;
  const out = [];
  for (let t = Math.ceil((t0 - off) / step) * step + off; t <= t1; t += step) out.push(t);
  return out;
}

/* Midnight reads as a date: 00:00 on its own says nothing about which day. */
function tickLabel(t, step) {
  const d = new Date(t);
  if (step >= DAY_MS) return mmdd(t);
  if (step < 60000) return hhmmss(t);
  return d.getHours() === 0 && d.getMinutes() === 0 ? mmdd(t) : hhmm(t);
}

/* Round a raw step up to a 1 / 2 / 5 * 10^n value so the labels stay tidy. */
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const n = (raw || 1) / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

function drawChart() {
  const dpr = window.devicePixelRatio || 1;
  const w = chartCanvas.clientWidth, h = chartCanvas.clientHeight;
  if (!w || !h) return;
  chartCanvas.width = Math.round(w * dpr);
  chartCanvas.height = Math.round(h * dpr);

  const ctx = chartCanvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  chartPts = [];
  chartGeom = null;

  const note = msg => {
    ctx.fillStyle = "#78828c";
    ctx.font = "12px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(msg, w / 2, h / 2);
  };
  const rows = windowRows();
  if (!rows.length) {
    note(listing || TRACKS.some(t => t.loading) ? "Loading…" : "No samples in this window");
    return;
  }

  const ch = CHANNELS[graphChannel];
  const data = [];
  for (let i = 0; i < rows.length; i++) {
    const v = ch.get(rows[i]);
    if (rows[i].t != null && v != null && isFinite(v)) data.push({ t: rows[i].t, v, i });
  }
  if (data.length < 2) { note(`No ${ch.label.toLowerCase()} samples in this log`); return; }

  /* A named channel has no scale of its own: one step per state the log holds,
     so rc states in the thirties do not pile up above an unused 0-31. */
  const levels = ch.text ? [...new Set(data.map(d => d.v))].sort((a, b) => a - b) : null;
  const at = v => levels ? levels.indexOf(v) : v;

  const t0 = viewRange.t0, t1 = viewRange.t1;
  let lo = levels ? -0.3 : ch.lo != null ? ch.lo : Math.min(...data.map(d => d.v));
  let hi = levels ? levels.length - 0.7 : ch.hi != null ? ch.hi : Math.max(...data.map(d => d.v));
  if (!levels && ch.hi == null) hi = Math.max(hi, lo + 1) * 1.05;
  if (hi <= lo) hi = lo + 1;

  /* State names need more room on the left than a two digit number does. */
  const padl = ch.text ? 108 : PAD.l;
  const x0 = padl, x1 = w - PAD.r, y0 = PAD.t, y1 = h - PAD.b;
  const px = t => x0 + (t1 > t0 ? (t - t0) / (t1 - t0) : 0.5) * (x1 - x0);
  const py = v => y1 - (at(v) - lo) / (hi - lo) * (y1 - y0);
  chartGeom = { x0, x1, y0, y1, t0, t1 };

  /* grid + labels */
  ctx.font = "10px system-ui, sans-serif";
  ctx.strokeStyle = "#2b3238"; ctx.lineWidth = 1;
  ctx.fillStyle = "#78828c";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  /* A named channel is only ever at the values the log holds, so those are the
     gridlines - stepping one by one up to a state like 34 labels nothing. */
  const step = ch.tick || niceStep((hi - lo) / 5);
  const ticks = [];

  if (levels) {
    ticks.push(...levels);
  } else {
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(v);
  }

  for (const v of ticks) {
    const y = Math.round(py(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillText(ch.text ? ch.text(v) : String(+v.toFixed(3)) + ch.unit, x0 - 5, y);
  }
  ctx.textBaseline = "top";
  const span = t1 - t0;
  const tstep = tickStep(span, Math.max(2, Math.min(8, Math.floor((x1 - x0) / 80))));

  /* Both ends of the window carry the date: a round tick is only a clock time,
     and the ends are what the graph is showing. A tick under one of them would
     overlap, so it keeps its gridline and loses its label. */
  const endLabel = t => mmdd(t) + " " + clock(t, span);
  const endRoom = Math.max(ctx.measureText(endLabel(t0)).width, ctx.measureText(endLabel(t1)).width) + 6;

  ctx.textAlign = "center";
  for (const t of tickTimes(t0, t1, tstep)) {
    const x = Math.round(px(t)) + 0.5;
    ctx.strokeStyle = "#232930";
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
    if (x - x0 > endRoom && x1 - x > endRoom) { ctx.fillText(tickLabel(t, tstep), x, y1 + 3); }
  }
  ctx.textAlign = "left";
  ctx.fillText(endLabel(t0), x0, y1 + 3);
  ctx.textAlign = "right";
  ctx.fillText(endLabel(t1), x1, y1 + 3);
  ctx.strokeStyle = "#3a424b";
  ctx.beginPath(); ctx.moveTo(x0 + .5, y0); ctx.lineTo(x0 + .5, y1 + .5); ctx.lineTo(x1, y1 + .5);
  ctx.stroke();

  /* the trace itself, broken wherever the log has a gap */
  ctx.strokeStyle = "#4cc9f0"; ctx.lineWidth = 1.5;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  let pen = false;
  for (let k = 0; k < data.length; k++) {
    const d = data[k], x = px(d.t), y = py(d.v);
    chartPts.push({ x, y, i: d.i });
    if (pen && d.t - data[k - 1].t <= GAP_MS) ctx.lineTo(x, y);
    else ctx.moveTo(x, y);
    pen = true;
  }
  ctx.stroke();

  /* scrub cursor, tied to the marker on the map */
  const cur = rows[chartIndex];
  if (cur && cur.t != null && cur.t >= t0 && cur.t <= t1) {
    const x = Math.round(px(cur.t)) + 0.5;
    ctx.strokeStyle = "#4cc9f0"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();

    const v = ch.get(cur);
    if (v != null && isFinite(v)) {
      ctx.fillStyle = "#4cc9f0";
      ctx.beginPath(); ctx.arc(x, py(v), 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* the range being dragged out right now */
  if (brush) {
    const a = Math.min(brush.from, brush.to), b = Math.max(brush.from, brush.to);
    ctx.fillStyle = "rgba(76, 201, 240, .18)";
    ctx.fillRect(a, y0, b - a, y1 - y0);
    ctx.strokeStyle = "#4cc9f0"; ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(a) + .5, y0 + .5, Math.round(b - a), y1 - y0 - 1);
  }
}

const canvasX = ev => ev.clientX - chartCanvas.getBoundingClientRect().left;

/* Canvas x -> time, clamped to the plotted window. */
function pxToTime(x) {
  const g = chartGeom;
  const f = Math.max(0, Math.min(1, (x - g.x0) / (g.x1 - g.x0)));
  return g.t0 + f * (g.t1 - g.t0);
}

/* A click without a drag just moves the scrub cursor. */
function scrubTo(x) {
  if (!chartPts.length) return;
  let best = chartPts[0];
  for (const p of chartPts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
  updateCursor(best.i);
}

/* The one way the window ever changes: store it, then load whatever files it
   now reaches over. */
function setRange(t0, t1) {
  viewRange = { t0, t1 };
  selectEnd = true;
  loadWindow();
}

/* Narrow to a time window. Each selection is taken inside the current one, so
   dragging repeatedly keeps zooming in. */
function zoomToRange(t0, t1) {
  const lo = Math.min(t0, t1), hi = Math.max(t0, t1);
  const kept = windowRows().filter(r => r.t >= lo && r.t <= hi);

  if (kept.length < 2) return;                 /* too thin to be useful */
  setRange(lo, hi);
}

function zoomOut() {
  const span = viewRange.t1 - viewRange.t0;
  setRange(viewRange.t0 - span / 2, viewRange.t1 + span / 2);
}

const DRAG_PX = 4;          /* shorter than this counts as a click, not a drag */

chartCanvas.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !chartGeom) return;
  chartCanvas.setPointerCapture(e.pointerId);
  const x = canvasX(e);
  brush = { from: x, to: x };
  drawChart();
});

chartCanvas.addEventListener("pointermove", e => {
  if (!brush) return;
  brush.to = canvasX(e);
  drawChart();
});

chartCanvas.addEventListener("pointerup", e => {
  if (!brush) return;
  const { from, to } = brush;
  brush = null;
  if (Math.abs(to - from) < DRAG_PX) { drawChart(); scrubTo(from); }
  else zoomToRange(pxToTime(from), pxToTime(to));
});

chartCanvas.addEventListener("pointercancel", () => { brush = null; drawChart(); });

chartCanvas.addEventListener("contextmenu", e => { e.preventDefault(); zoomOut(); });

document.getElementById("earlier").addEventListener("click", () =>
  setRange(viewRange.t0 - (viewRange.t1 - viewRange.t0) / 2, viewRange.t1));

document.getElementById("later").addEventListener("click", () =>
  setRange(viewRange.t0, viewRange.t1 + (viewRange.t1 - viewRange.t0) / 2));

new ResizeObserver(() => drawChart()).observe(chartCanvas);

/* -------------------------------------------------------------- loading -- */

/* Only failures are worth the space; the spinner says when something is loading. */
const statusEl = document.getElementById("status");
function say(msg, isError) {
  statusEl.textContent = isError ? msg : "";
  statusEl.className = isError ? "error" : "hidden";
}

const WORKLOG_DIR = "worklogs/";

async function fetchRows(track) {
  const res = await fetch(track.url, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
  return parseCsv(await res.text());
}

/* Only local files picked with Load file take this route; server logs follow
   the window. */
async function toggle(track) {
  if (track.on) {                       /* clicking a shown file hides it */
    track.on = false;
    if (activeKey === track.key) activeKey = null;
    redraw(false);
    saveState();
    return;
  }

  activeKey = track.key;

  if (!track.rows) {
    track.loading = true;
    renderBusy();
    say("Loading " + track.name + " …");
    try {
      const { rows, skipped } = await fetchRows(track);
      track.loading = false;
      if (!rows.length) { say("No usable rows in " + track.name, true); renderBusy(); return; }
      track.rows = rows;
      say(`${track.name}: ${rows.length} samples` + (skipped ? `, ${skipped} rows skipped` : ""));
    } catch (e) {
      track.loading = false;
      say("Could not load " + track.name + ": " + e.message, true);
      renderBusy();
      return;
    }
  }

  track.on = true;
  if (track.rows[0].t != null) {
    viewRange = { t0: track.rows[0].t, t1: track.rows[track.rows.length - 1].t };
  }
  selectEnd = true;                     /* a freshly shown file opens at its newest sample */
  redraw(true);
  saveState();
}

/* mowerlog_YYYYMMDD_HH_MM_SS.csv, named in UTC when the file was started. */
function fileStart(name) {
  const m = /(\d{4})(\d{2})(\d{2})_(\d{2})_(\d{2})_(\d{2})/.exec(name);

  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
}

/* Every server log overlapping the window. A file runs from its own start until
   the next newer one starts, so the names alone say which ones are worth
   fetching. The newest is still being written and has no end: the mower clock
   runs ahead of this browser often enough that testing it against Date.now()
   drops the live samples just as you zoom in on them. */
function tracksInWindow() {
  const logs = listedTracks().filter(t => fileStart(t.name) != null);
  const hits = [];

  for (let i = 0; i < logs.length; i++) {
    const from = fileStart(logs[i].name);
    const to = i ? fileStart(logs[i - 1].name) : Infinity;
    if (from <= viewRange.t1 && to >= viewRange.t0) hits.push(logs[i]);
  }
  return hits;
}

/* Fetched rows are kept, so walking the window back and forth over one file
   costs nothing the second time. */
async function loadWindow(refetch) {
  const want = tracksInWindow();

  selectEnd = true;          /* a window just loaded opens on its newest sample */

  for (const t of TRACKS) {
    if (!want.includes(t)) t.on = false;
  }

  for (const t of want) {
    if (!t.rows || refetch) {
      t.loading = true;
      renderBusy();
      try {
        const { rows } = await fetchRows(t);
        t.rows = rows.length ? withLiveTail(rows, t.rows) : t.rows;
      } catch (e) {
        say("Could not load " + t.name + ": " + e.message, true);
      }
      t.loading = false;
    }
    t.on = !!(t.rows && t.rows.length);
  }

  const newest = want.find(t => t.on);
  if (newest) activeKey = newest.key;
  redraw(true);
  saveState();
}

/* The copy on the server is rsynced every minute, so it lags the live feed by a
   minute or two. Anything we already hold past the end of the file came from the
   feed and would be thrown away by a plain reload, so carry it over. */
function withLiveTail(rows, had) {
  const last = rows[rows.length - 1];
  const tail = (had || []).filter(r => r.t != null && last.t != null && r.t > last.t);
  return tail.length ? rows.concat(tail) : rows;
}

/* What the mower has written so far, whether or not it is on the air. */
async function reload() {
  listing = true;
  renderBusy();
  await listDirectory();
  listing = false;
  await loadWindow(true);
}

/* Directory listing: accepts a JSON array of names, or an HTML index whose
   links point at the .csv files (lighttpd dir-listing, nginx autoindex, …). */
async function listDirectory() {
  const dirUrl = WORKLOG_DIR;
  say("Listing " + dirUrl + " …");
  const fail = msg => say(msg, true);

  let text, contentType;
  try {
    const res = await fetch(dirUrl, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    contentType = res.headers.get("content-type") || "";
    text = await res.text();
  } catch (e) {
    fail("Directory listing unavailable: " + e.message);
    return;
  }

  let names = [];
  if (contentType.includes("json") || text.trim().startsWith("[")) {
    try {
      names = JSON.parse(text).map(e => typeof e === "string" ? e : (e.name || e.file || ""));
    } catch { /* fall through to HTML parsing */ }
  }
  if (!names.length) {
    const doc = new DOMParser().parseFromString(text, "text/html");
    names = [...doc.querySelectorAll("a[href]")]
      .map(a => a.getAttribute("href"))
      .filter(h => h && /\.csv(\?|$)/i.test(h))
      .map(h => h.split("/").pop());
  }

  names = [...new Set(names.filter(Boolean))].sort().reverse();   /* newest first */
  if (!names.length) {
    fail("No .csv files found at " + dirUrl + " (directory listing may be disabled).");
    renderBusy();
    return;
  }

  for (const name of names) addTrack({ key: dirUrl + name, name, url: dirUrl + name });
  renderBusy();
}

/* --------------------------------------------------------- own layers -- */
/* One .json per layer in layers/, listed the same way the logs are:
     line   {name, coords:[[lat,lon],…], color, weight, opacity, show}
     image  {name, image:"file.png", corners:[tl,tr,bl], opacity, show}
   Three corners place a rotated image; two are read as [sw, ne]. */

const LAYER_DIR = "layers/";

const RotatedImage = L.Layer.extend({
  initialize(url, corners, options) {
    this._url = url;
    this._corners = corners.map(c => L.latLng(c));
    L.Util.setOptions(this, options);
  },

  onAdd(map) {
    this._img = L.DomUtil.create("img", "", map.getPanes().overlayPane);
    this._img.style.position = "absolute";
    this._img.style.transformOrigin = "0 0";
    this._img.style.opacity = this.options.opacity ?? 1;
    this._img.onload = () => this._place();
    this._img.src = this._url;
    map.on("zoomend viewreset", this._place, this);
    this._place();
  },

  onRemove(map) {
    L.DomUtil.remove(this._img);
    map.off("zoomend viewreset", this._place, this);
  },

  /* Map the image's own pixel box onto the three corners: (0,0)->tl,
     (w,0)->tr, (0,h)->bl, which is exactly a CSS matrix(). */
  _place() {
    if (!this._map || !this._img.naturalWidth) return;
    const [tl, tr, bl] = this._corners.map(c => this._map.latLngToLayerPoint(c));
    const w = this._img.naturalWidth, h = this._img.naturalHeight;
    const m = [(tr.x - tl.x) / w, (tr.y - tl.y) / w,
               (bl.x - tl.x) / h, (bl.y - tl.y) / h, tl.x, tl.y];
    this._img.style.transform = `matrix(${m.join(",")})`;
  }
});

function buildLayer(def) {
  if (def.image) {
    let c = def.corners;
    if (c && c.length === 2) c = [[c[1][0], c[0][1]], [c[1][0], c[1][1]], [c[0][0], c[0][1]]];
    if (!c || c.length !== 3) return null;
    return new RotatedImage(LAYER_DIR + def.image, c, { opacity: def.opacity ?? 1 });
  }
  if (def.coords && def.coords.length > 1) {
    return L.polyline(def.coords, {
      color: def.color || "#f9c74f", weight: def.weight || 2,
      opacity: def.opacity ?? 0.9, lineJoin: "round"
    });
  }
  return null;
}

async function loadLayers() {
  let text;
  try {
    const res = await fetch(LAYER_DIR, { cache: "no-store" });
    if (!res.ok) return;                       /* no layers/ directory: fine */
    text = await res.text();
  } catch { return; }

  const doc = new DOMParser().parseFromString(text, "text/html");
  const files = [...new Set([...doc.querySelectorAll("a[href]")]
    .map(a => a.getAttribute("href"))
    .filter(h => h && /\.json(\?|$)/i.test(h))
    .map(h => h.split("/").pop()))].sort();

  for (const f of files) {
    try {
      const def = await (await fetch(LAYER_DIR + f, { cache: "no-store" })).json();
      const layer = buildLayer(def);
      if (!layer) continue;
      addOverlay(layer, def.name || f.replace(/\.json$/i, ""), def.show);
    } catch { /* a layer that will not load must not stop the others */ }
  }
  saveState();                 /* record the layers now known to this browser */
}

/* ----------------------------------------------------------------- live -- */
/* The mower feed is tunnelled to /webbsoket as raw log lines. The socket is
   held only while Live is pressed, so a page left open costs the mower nothing.
   Samples land in the file the scrubber follows, in memory only - nothing is
   written back to the server. */

const LIVE_URL = `wss://${location.host}/webbsoket`;
const LIVE_RETRY_MS = 30000;   /* reopen a socket that closed or went quiet */
const LIVE_RELOAD_MS = 90000;  /* long enough for the rsync to have caught up */
const LIVE_STALE_MS = 5000;    /* no sample for this long: not reachable */

let liveOn = false;
let liveSocket = null;
let liveRetry = null;
let liveReload = null;
let liveSeen = 0;              /* when the newest sample arrived */
let liveTail = "";             /* frames split anywhere, so keep the part line */
const liveDecoder = new TextDecoder();

const liveUp = () => Date.now() - liveSeen < LIVE_STALE_MS;

/* Pressed and receiving is "on", pressed and silent is "wait": the mower is
   off or out of range, and the retry keeps trying until it answers. */
/* Live samples belong to the newest log on show. */
function liveTarget() {
  let newest = null;

  for (const t of selected()) {
    if (!newest || trackStart(t) > trackStart(newest)) newest = t;
  }
  return newest;
}

function liveButton() {
  const b = document.getElementById("live");
  const target = liveTarget();

  b.disabled = !target;
  b.classList.toggle("on", liveOn && liveUp());
  b.classList.toggle("wait", liveOn && !liveUp());
  b.title = !target ? "Show a file first - live samples are appended to it"
          : !liveOn ? "Append live samples to " + target.name
          : liveUp() ? "Appending live samples to " + target.name
          : "Waiting for the mower to answer";

  woButton();
}

/* Sitting on the newest sample means follow the new end, otherwise stay put. */
function liveAppend(rows) {
  const target = liveTarget();
  if (!target) return false;

  const last = target.rows[target.rows.length - 1];
  const fresh = rows.filter(r => !last || r.t == null || last.t == null || r.t > last.t);
  if (!fresh.length) return false;

  const wasLast = chartIndex >= windowRows().length - 1;
  const atEnd = !!last && last.t != null && viewRange.t1 >= last.t;
  const newest = fresh[fresh.length - 1].t;

  target.rows.push(...fresh);

  /* A window sitting on the end of the log would otherwise keep showing the same
     samples while new ones pile up past its right edge. Slide the whole window
     up to the newest sample so its span still holds. */
  if (wasLast && atEnd && newest > viewRange.t1) {
    viewRange = { t0: newest - (viewRange.t1 - viewRange.t0), t1: newest };
  }

  selectEnd = wasLast;
  return true;
}

function liveMessage(data) {
  const lines = (liveTail + liveDecoder.decode(data, { stream: true })).split("\n");

  liveTail = lines.pop();
  if (!lines.length) return;
  liveSeen = Date.now();

  /* One parse for the whole batch: fieldtype 2 carries onto the rows after it. */
  const { rows } = parseCsv(lines.join("\n"));
  if (liveOn && rows.length && liveAppend(rows)) redraw(false);
  liveButton();
}

function liveConnect() {
  liveRetry = null;
  liveTail = "";
  /* mod_wstunnel answers with Sec-WebSocket-Protocol: binary, and a browser
     rejects a subprotocol it did not ask for, so ask for it. */
  liveSocket = new WebSocket(LIVE_URL, "binary");
  liveSocket.binaryType = "arraybuffer";
  liveSocket.onopen = () => { liveSeen = Date.now(); liveButton(); };
  liveSocket.onmessage = e => liveMessage(e.data);
  liveSocket.onerror = () => liveSocket.close();
  liveSocket.onclose = () => {
    liveSocket = null;
    if (liveOn) liveRetry = setTimeout(liveConnect, LIVE_RETRY_MS);
    liveButton();
  };
}

function liveDisconnect() {
  clearTimeout(liveRetry);
  liveRetry = null;
  liveSeen = 0;
  if (liveSocket) liveSocket.close();   /* onclose leaves it alone while liveOn is false */
}

/* A tunnel can stay open with nothing behind it, so silence recycles it. */
setInterval(() => {
  if (liveOn && liveSocket && liveSocket.readyState === WebSocket.OPEN && Date.now() - liveSeen > LIVE_RETRY_MS) liveSocket.close();
  liveButton();
}, 1000);

/* ------------------------------------------------------------ workorder -- */
/* Workorders are files workorder/<name>.wo on this server; the mower is told to
   run one by name over the live socket - see logformat.txt, to-mower fieldtype 1.
   Names outside a-z A-Z 0-9 _- are skipped: they cannot be sent as CSV. */

const WORKORDER_DIR = "workorder/";
const woDialog = document.getElementById("woDialog");

const woReady = () => !!liveSocket && liveSocket.readyState === WebSocket.OPEN;

function woButton() {
  const hint = woReady() ? "" : " (press Live first - the command goes over the live socket)";

  for (const id of ["workorder", "abort"]) {
    const b = document.getElementById(id);
    b.disabled = !woReady();
    b.title = (id === "abort" ? "Abort the running workorder" : "Start a workorder on the mower") + hint;
  }
}

/* The tunnel is frame-type binary, so send bytes rather than a text frame. */
function woSend(action, name) {
  if (!woReady()) return;
  liveSocket.send(new TextEncoder().encode(`1,${action},${name}\n`));
  document.getElementById("woSent").textContent = action === 1 ? "Sent: run " + name : "Sent: abort";
}

async function woNames() {
  let text;
  try {
    const res = await fetch(WORKORDER_DIR, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    text = await res.text();
  } catch (e) {
    say("Workorder listing unavailable: " + e.message, true);
    return [];
  }

  const doc = new DOMParser().parseFromString(text, "text/html");
  const names = [...doc.querySelectorAll("a[href]")]
    .map(a => a.getAttribute("href"))
    .map(h => h ? decodeURIComponent(h.split("?")[0].split("/").pop()) : "")
    .filter(n => /^[A-Za-z0-9_-]+\.wo$/.test(n))
    .map(n => n.replace(/\.wo$/, ""));

  return [...new Set(names)].sort();
}

function woItem(text, name) {
  const li = document.createElement("li");

  li.textContent = text;
  if (!name) li.className = "none";
  else li.addEventListener("click", () => { woSend(1, name); woDialog.close(); });
  return li;
}

async function woOpen() {
  const list = document.getElementById("woList");

  list.replaceChildren(woItem("Listing …"));
  woDialog.showModal();

  const names = await woNames();
  if (!woDialog.open) return;                  /* cancelled while listing */

  list.replaceChildren(...(names.length ? names.map(n => woItem(n, n))
                                        : [woItem("No .wo files in " + WORKORDER_DIR)]));
}

woButton();

/* ----------------------------------------------------------------- menu -- */

const menuList = document.getElementById("menuList");
const colorPanel = document.getElementById("colorPanel");
const channelPanel = document.getElementById("channelPanel");

/* "" closes the lot. */
function openPanel(name) {
  menuList.classList.add("hidden");
  colorPanel.classList.toggle("hidden", name !== "color");
  channelPanel.classList.toggle("hidden", name !== "channel");
  layerControl.getContainer().classList.toggle("hidden", name !== "layers");
}

/* A list of labels, one of them marked, that sets `pick` and closes. */
function fillPanel(panel, items, current, pick) {
  for (const [key, label] of items) {
    const b = document.createElement("button");

    b.textContent = label;
    b.classList.toggle("on", key === current);
    b.addEventListener("click", () => {
      for (const other of panel.children) { other.classList.toggle("on", other === b); }
      openPanel("");
      pick(key);
      saveState();
    });
    panel.appendChild(b);
  }
}

document.getElementById("menuBtn").addEventListener("click", e => {
  e.preventDefault();
  const open = menuList.classList.contains("hidden");
  openPanel("");
  menuList.classList.toggle("hidden", !open);
});

for (const [item, label] of [["layers", "Layers"], ["color", "Line color"], ["channel", "Graph data"]]) {
  const b = document.createElement("button");

  b.textContent = label;
  b.addEventListener("click", () => openPanel(item));
  menuList.appendChild(b);
}

fillPanel(colorPanel, COLOR_MODES, colorMode, key => { colorMode = key; redraw(false); });
fillPanel(channelPanel, Object.entries(CHANNELS).map(([key, ch]) => [key, ch.label]), graphChannel, key => { graphChannel = key; drawChart(); });

/* --------------------------------------------------------------- events -- */

document.getElementById("workorder").addEventListener("click", woOpen);

document.getElementById("abort").addEventListener("click", () => woSend(2, ""));

document.getElementById("woCancel").addEventListener("click", () => woDialog.close());

/* Switching live on takes what the server holds right now, and once more when the
   rsync has caught up with the samples the feed delivered in the meantime. */
document.getElementById("live").addEventListener("click", () => {
  liveOn = !liveOn;
  clearTimeout(liveReload);

  if (liveOn) {
    liveConnect();
    reload();
    liveReload = setTimeout(reload, LIVE_RELOAD_MS);
  } else {
    liveDisconnect();
  }
  liveButton();
});

/* Left / right arrow steps the scrub cursor one sample, unless a form control
   has focus and wants the key itself. */
document.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;

  const rows = windowRows();
  if (!rows.length) return;
  updateCursor(Math.max(0, Math.min(rows.length - 1, chartIndex + (e.key === "ArrowRight" ? 1 : -1))));
  e.preventDefault();
});

/* ----------------------------------------------------------- start-up ---- */
/* ?log=<name> shows exactly those logs and takes its window from them; without
   it the window decides, and it opens on the last 24 hours. */


const startTracks = new URLSearchParams(location.search).getAll("log")
  .map(name => addTrack({ key: WORKLOG_DIR + name, name, url: WORKLOG_DIR + name }));
renderBusy();

(async () => {
  listing = true;
  renderBusy();
  await listDirectory();
  listing = false;

  if (startTracks.length) {
    for (const t of startTracks) await toggle(t);
  } else {
    await loadWindow();
  }

  await loadLayers();
})();
</script>
</body>
</html>
