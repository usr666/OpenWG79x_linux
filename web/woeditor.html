<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workorder editor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; font: 13px/1.4 system-ui, sans-serif; background: #14171a; color: #e6e6e6; }

  #sidebar {
    width: 300px; flex: none; display: flex; flex-direction: column;
    background: #181b1f; border-right: 1px solid #2b3238; overflow: hidden;
  }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #map { flex: 1; min-height: 0; background: #14171a; }

  /* ---- the workorder itself, along the bottom quarter of the window ---- */
  #list {
    height: 25%; flex: none; display: flex; flex-direction: column;
    padding: 6px 8px 4px; background: #181b1f; border-top: 1px solid #2b3238;
  }
  #listHead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  #listName { color: #9aa4ae; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #listInfo { margin-left: auto; color: #78828c; white-space: nowrap; }
  #rows { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
  #rows li {
    display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 4px;
    cursor: pointer; user-select: none; font-variant-numeric: tabular-nums;
  }
  #rows li:hover { background: #22262b; }
  #rows li.on { background: #23303a; outline: 1px solid #4cc9f0; }
  #rows .num { color: #78828c; width: 2.5em; text-align: right; flex: none; }
  #rows .raw { color: #f9c74f; }
  #rows .end { color: #78828c; font-style: italic; }

  section { padding: 10px; border-bottom: 1px solid #2b3238; }
  section.grow { flex: 1; min-height: 0; overflow-y: auto; border-bottom: none; }
  h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .04em; text-transform: uppercase; color: #9aa4ae; }
  h2 { font-size: 11px; margin: 0 0 6px; letter-spacing: .06em; text-transform: uppercase; color: #78828c; }

  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  input, select, button {
    background: #22262b; color: #e6e6e6; border: 1px solid #3a424b;
    border-radius: 4px; padding: 5px 6px; font: inherit;
  }
  button { cursor: pointer; white-space: nowrap; }
  button:hover { background: #2c323a; }
  button:disabled { color: #5a636c; border-color: #2b3238; cursor: default; }
  button:disabled:hover { background: #22262b; }
  .row button { flex: 1; }

  /* ---- one block per command ---- */
  .cmd { margin-bottom: 12px; }
  .cmd h2 { cursor: pointer; }
  .cmd h2::before { content: "▸ "; }
  .cmd.open h2::before { content: "▾ "; }
  .cmd .field, .cmd .row { display: none; }
  .cmd.open .field { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .cmd.open .row { display: flex; }
  .cmd .field label { flex: 1; color: #9aa4ae; }
  .cmd .field input, .cmd .field select { width: 90px; flex: none; }
  .cmd.point .field input { width: 110px; }

  #fileName { color: #9aa4ae; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { color: #9aa4ae; min-height: 1.4em; }
  #status.error { color: #ff8080; }
  .hidden { display: none !important; }

  /* ---- load picker ---- */
  #loadDialog, #delDialog {
    background: #181b1f; color: #e6e6e6; border: 1px solid #3a424b; border-radius: 6px;
    padding: 10px; min-width: 240px; font: inherit;
  }
  #loadDialog::backdrop, #delDialog::backdrop { background: rgba(0, 0, 0, .5); }
  #loadList, #delList { list-style: none; margin: 0 0 8px; padding: 0; max-height: 50vh; overflow-y: auto; }
  #loadList li, #delList li { padding: 5px 6px; border-radius: 4px; cursor: pointer; user-select: none; }
  #loadList li:hover, #delList li:hover { background: #22262b; }
  #loadList li.none, #delList li.none { color: #78828c; cursor: default; }
  #loadList li.none:hover, #delList li.none:hover { background: none; }
  #delList label { display: flex; align-items: center; gap: 7px; cursor: pointer; }

  .marker {
    width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: #4cc9f0; color: #14171a; border: 1px solid #14171a;
    font: 11px/17px system-ui, sans-serif; text-align: center; font-weight: 600;
  }
  .marker.on { background: #f9c74f; }
  .marker.center { background: #43aa8b; }
  .marker.target { background: #f3722c; }
  .marker.pending { background: none; border: 2px dashed #f9c74f; }
</style>
</head>
<body>

<div id="sidebar">
  <section>
    <h1>File</h1>
    <div class="row">
      <button id="new">New</button>
      <button id="load">Load…</button>
    </div>
    <div class="row">
      <button id="save">Save</button>
      <button id="saveas">Save as…</button>
    </div>
    <div class="row" style="margin-bottom:0">
      <button id="download">Download</button>
      <button id="del">Delete…</button>
    </div>
    <div id="fileName" style="margin-top:6px"></div>
  </section>

  <section class="grow">
    <h1>Commands</h1>
    <div id="commands"></div>
  </section>

  <section>
    <div id="status" class="hidden"></div>
  </section>
</div>

<dialog id="loadDialog">
  <h2>Load workorder</h2>
  <ul id="loadList"></ul>
  <button id="loadCancel">Cancel</button>
</dialog>

<dialog id="delDialog">
  <h2>Delete workorders</h2>
  <ul id="delList"></ul>
  <div class="row" style="margin-bottom:0">
    <button id="delGo">Delete</button>
    <button id="delCancel">Cancel</button>
  </div>
</dialog>

<div id="main">
  <div id="map"></div>
  <div id="list">
    <div id="listHead">
      <span id="listName"></span>
      <button id="delete">Delete row</button>
      <span id="listInfo"></span>
    </div>
    <ol id="rows"></ol>
  </div>
</div>

<script>
/* Workorder editor: builds workorder/<name>.wo files - see workorder_format.txt.
   Rows are inserted after the selected row, or at the end when the end marker
   is selected. Saving PUTs the file back to the same directory it was listed
   from, so the server must accept PUT (lighttpd mod_webdav). */

/* -------------------------------------------------------------- state ---- */

const STORE_KEY = "woeditor.v1";

const STATE = (() => {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
})();

function saveState() {
  const state = {
    known: OVERLAYS.map(o => o.name),
    layers: OVERLAYS.filter(o => map.hasLayer(o.layer)).map(o => o.name)
  };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { /* blocked or full */ }
}

const statusEl = document.getElementById("status");
function say(msg, isError) {
  statusEl.textContent = msg || "";
  statusEl.className = !msg ? "hidden" : isError ? "error" : "";
}

/* ---------------------------------------------------------------- map ---- */
/* Same map as mowermap: every layer is a checkbox, and the imagery is upscaled
   past the zoom the tiles have, because the work happens at centimetre scale. */

const MAX_ZOOM = 26;

const map = L.map("map", {
  preferCanvas: true, maxZoom: MAX_ZOOM, zoomSnap: 0.5, zoomDelta: 0.5,
  wheelPxPerZoomLevel: 120, keyboard: false
}).setView([60.574, 15.631], 18);

const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: MAX_ZOOM, maxNativeZoom: 19, attribution: "&copy; OpenStreetMap contributors"
});
const sat = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: MAX_ZOOM, maxNativeZoom: 18, attribution: "Imagery &copy; Esri"
});

const layerControl = L.control.layers(null, null, { position: "topright" }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

const OVERLAYS = [];   /* {name, layer} for every checkbox in the control */

function addOverlay(layer, name, show) {
  OVERLAYS.push({ name, layer });
  layerControl.addOverlay(layer, name);
  const known = (STATE.known || []).includes(name);
  if (known ? (STATE.layers || []).includes(name) : show) layer.addTo(map);
}

addOverlay(sat, "Satellite", true);
addOverlay(osm, "OpenStreetMap", false);

map.on("overlayadd overlayremove", saveState);

const pathLayer = L.layerGroup().addTo(map);     /* the run-to-point markers */

/* --------------------------------------------------------- own layers -- */
/* One .json per layer in layers/, exactly as mowermap reads them:
     line   {name, coords:[[lat,lon],…], color, weight, opacity, show}
     image  {name, image:"file.png", corners:[tl,tr,bl], opacity, show}
   Three corners place a rotated image; two are read as [sw, ne]. */

const LAYER_DIR = "layers/";

const RotatedImage = L.Layer.extend({
  initialize(url, corners, options) {
    this._url = url;
    this._corners = corners.map(c => L.latLng(c));
    L.Util.setOptions(this, options);
  },

  onAdd(map) {
    this._img = L.DomUtil.create("img", "", map.getPanes().overlayPane);
    this._img.style.position = "absolute";
    this._img.style.transformOrigin = "0 0";
    this._img.style.opacity = this.options.opacity ?? 1;
    this._img.onload = () => this._place();
    this._img.src = this._url;
    map.on("zoomend viewreset", this._place, this);
    this._place();
  },

  onRemove(map) {
    L.DomUtil.remove(this._img);
    map.off("zoomend viewreset", this._place, this);
  },

  _place() {
    if (!this._map || !this._img.naturalWidth) return;
    const [tl, tr, bl] = this._corners.map(c => this._map.latLngToLayerPoint(c));
    const w = this._img.naturalWidth, h = this._img.naturalHeight;
    const m = [(tr.x - tl.x) / w, (tr.y - tl.y) / w,
               (bl.x - tl.x) / h, (bl.y - tl.y) / h, tl.x, tl.y];
    this._img.style.transform = `matrix(${m.join(",")})`;
  }
});

function buildLayer(def) {
  if (def.image) {
    let c = def.corners;
    if (c && c.length === 2) c = [[c[1][0], c[0][1]], [c[1][0], c[1][1]], [c[0][0], c[0][1]]];
    if (!c || c.length !== 3) return null;
    return new RotatedImage(LAYER_DIR + def.image, c, { opacity: def.opacity ?? 1 });
  }
  if (def.coords && def.coords.length > 1) {
    return L.polyline(def.coords, {
      color: def.color || "#f9c74f", weight: def.weight || 2,
      opacity: def.opacity ?? 0.9, lineJoin: "round"
    });
  }
  return null;
}

async function loadLayers() {
  let text;
  try {
    const res = await fetch(LAYER_DIR, { cache: "no-store" });
    if (!res.ok) return;                       /* no layers/ directory: fine */
    text = await res.text();
  } catch { return; }

  const doc = new DOMParser().parseFromString(text, "text/html");
  const files = [...new Set([...doc.querySelectorAll("a[href]")]
    .map(a => a.getAttribute("href"))
    .filter(h => h && /\.json(\?|$)/i.test(h))
    .map(h => h.split("/").pop()))].sort();

  for (const f of files) {
    try {
      const def = await (await fetch(LAYER_DIR + f, { cache: "no-store" })).json();
      const layer = buildLayer(def);
      if (!layer) continue;
      addOverlay(layer, def.name || f.replace(/\.json$/i, ""), def.show);
    } catch { /* a layer that will not load must not stop the others */ }
  }
  saveState();
}

/* ----------------------------------------------------------- commands -- */
/* One block per command in workorder_format.txt. The fields are written in
   file order, so a row is just [cmd, …field values]. */

const YESNO = [["0", "no"], ["1", "yes"]];
const EVENTS = [["0", "timeout only"], ["1", "turn complete"], ["2", "rtk float or fix"], ["3", "rtk fix"]];

const COMMANDS = [
  { id: 1, name: "Run", fields: [
    { key: "left",  label: "Left speed %",  type: "num", min: -100, max: 100, def: 50 },
    { key: "right", label: "Right speed %", type: "num", min: -100, max: 100, def: 50 },
    { key: "disc",  label: "Disc speed %",  type: "num", min: -100, max: 100, def: 0 },
    { key: "force", label: "Force run",     type: "sel", options: YESNO, def: "0" }
  ]},
  { id: 2, name: "Turn", fields: [
    { key: "speed", label: "Wheel speed %", type: "num", min: -100, max: 100, def: 30 },
    { key: "angle", label: "Turn angle °",  type: "num", min: 0, max: 255, def: 90 },
    { key: "dir",   label: "Direction",     type: "sel", options: [["0", "left"], ["1", "right"]], def: "1" },
    { key: "disc",  label: "Disc speed %",  type: "num", min: -100, max: 100, def: 0 },
    { key: "force", label: "Force run",     type: "sel", options: YESNO, def: "0" }
  ]},
  { id: 3, name: "Wait", fields: [
    { key: "event",   label: "Wait for",   type: "sel", options: EVENTS, def: "1" },
    { key: "timeout", label: "Timeout s",  type: "num", min: 0, max: 255, def: 10 }
  ]},
  { id: 4, name: "Run to point", point: true, fields: [
    { key: "lat", label: "Latitude",  type: "text", def: "" },
    { key: "ns",  label: "N/S",       type: "sel", options: [["N", "N"], ["S", "S"]], def: "N" },
    { key: "lon", label: "Longitude", type: "text", def: "" },
    { key: "ew",  label: "E/W",       type: "sel", options: [["E", "E"], ["W", "W"]], def: "E" }
  ]},
  { id: 5, name: "Mow", fields: [
    { key: "time", label: "Mow time s", type: "num", min: 0, max: 65535, def: 600 }
  ]},
  { id: 6, name: "Go to charge", fields: [] },
  { id: 7, name: "Mow within polygon", poly: true, fields: [
    { key: "time", label: "Mow time s", type: "num", min: 0, max: 65535, def: 600 }
  ]},
  { id: 8, name: "Follow line", line: true, fields: [] }
];

const byId = id => COMMANDS.find(c => c.id === id);

function buildCommands() {
  const box = document.getElementById("commands");

  for (const cmd of COMMANDS) {
    const block = document.createElement("div");

    block.className = "cmd" + (cmd.point ? " point" : "");
    block.innerHTML = `<h2>${cmd.id} — ${cmd.name}</h2>`;

    for (const f of cmd.fields) {
      const div = document.createElement("div");
      const input = f.type === "sel"
        ? `<select id="f${cmd.id}_${f.key}">` + f.options.map(o => `<option value="${o[0]}">${o[1]}</option>`).join("") + `</select>`
        : `<input id="f${cmd.id}_${f.key}" type="${f.type === "num" ? "number" : "text"}"${f.type === "num" ? ` min="${f.min}" max="${f.max}"` : ""}>`;

      div.className = "field";
      div.innerHTML = `<label for="f${cmd.id}_${f.key}">${f.label}</label>${input}`;
      block.appendChild(div);
    }

    const buttons = document.createElement("div");
    buttons.className = "row";
    buttons.innerHTML = cmd.poly || cmd.line
      ? `<button id="pick${cmd.id}">Pick ${cmd.poly ? "polygon" : "line"}</button><button id="done${cmd.id}">Done</button>`
      : `<button id="ins${cmd.id}">Insert</button><button id="rep${cmd.id}">Replace</button>`;
    block.appendChild(buttons);

    const replace = document.createElement("div");
    replace.className = "row";
    replace.innerHTML = `<button id="rep${cmd.id}">Replace</button>`;
    if (cmd.poly) block.appendChild(replace);
    box.appendChild(block);

    buttons.children[0].addEventListener("click", () => cmd.poly || cmd.line ? pickStart(cmd) : insertRow(cmd));
    buttons.children[1].addEventListener("click", () => cmd.poly || cmd.line ? pickDone(cmd) : replaceRow(cmd));
    if (cmd.poly) replace.children[0].addEventListener("click", () => replacePoly(cmd));
    block.querySelector("h2").addEventListener("click", () => openBlock(block));
    setFields(cmd, cmd.fields.map(f => f.def));
    cmd.block = block;
  }
  openBlock(COMMANDS[0].block);
}

/* One block open at a time: the column stays short, and the open one is what
   Insert and Replace work on. */
function openBlock(block) {
  for (const b of document.querySelectorAll("#commands .cmd")) b.classList.toggle("open", b === block);
}

const fieldEl = (cmd, f) => document.getElementById(`f${cmd.id}_${f.key}`);

const getFields = cmd => cmd.fields.map(f => fieldEl(cmd, f).value.trim());

function setFields(cmd, values) {
  cmd.fields.forEach((f, i) => { fieldEl(cmd, f).value = values[i] ?? f.def; });
}

/* A row the mower would refuse is not worth writing to the file. */
function checkFields(cmd, values) {
  for (let i = 0; i < cmd.fields.length; i++) {
    const f = cmd.fields[i];
    const v = values[i];

    if (v === "" || v.includes(",")) return f.label + " is empty";
    if (f.type === "num" && !(Number.isInteger(+v) && +v >= f.min && +v <= f.max)) return `${f.label} must be ${f.min}..${f.max}`;
    if (f.type === "text" && !/^\d+\.\d+$/.test(v)) return f.label + " must come from a click on the map";
  }
  return "";
}

/* --------------------------------------------------------------- rows -- */
/* {cmd, values} for a command this editor knows, {raw} for anything else in a
   loaded file - unknown rows are kept so that saving never drops them. */

let rows = [];
let selected = -1;         /* -1 is the end marker: new rows go last */
let fileName = "";         /* the name it was loaded as, "" until saved */
let dirty = false;

function describe(row) {
  if (row.raw) return row.raw;

  const v = row.values;
  const force = f => f === "1" ? ", force" : "";
  const event = (EVENTS.find(e => e[0] === v[0]) || [, v[0]])[1];

  switch (row.cmd) {
    case 1: return `run  left ${v[0]}%  right ${v[1]}%  disc ${v[2]}%${force(v[3])}`;
    case 2: return `turn ${v[1]}° ${v[2] === "1" ? "right" : "left"}  speed ${v[0]}%  disc ${v[3]}%${force(v[4])}`;
    case 3: return v[0] === "0" ? `wait ${v[1]}s` : `wait for ${event}, timeout ${v[1]}s`;
    case 4: return `point ${v[0]}${v[1]}  ${v[2]}${v[3]}`;
    case 5: return `mow ${v[0]}s`;
    case 6: return "go to charge";
    case 7: return `mow polygon of ${v[5]} corners, ${v[0]}s`;
    case 8: return `follow line of ${v[0]} points to point ${v[1]}`;
  }
  return "";
}

const rowText = row => row.raw ? row.raw : [row.cmd, ...row.values].join(",");

function renderRows() {
  const list = document.getElementById("rows");
  const items = [];

  rows.forEach((row, i) => {
    const li = document.createElement("li");

    li.innerHTML = `<span class="num">${i + 1}</span><span${row.raw ? ' class="raw"' : ""}></span>`;
    li.lastChild.textContent = describe(row);
    if (i === selected) li.className = "on";
    li.addEventListener("click", () => select(i));
    items.push(li);
  });

  const end = document.createElement("li");
  end.innerHTML = `<span class="num"></span><span class="end">— end —</span>`;
  if (selected === -1) end.className = "on";
  end.addEventListener("click", () => select(-1));
  items.push(end);

  list.replaceChildren(...items);

  const name = (fileName ? fileName + ".wo" : "Untitled") + (dirty ? " *" : "");

  document.getElementById("fileName").textContent = name;
  document.getElementById("listName").textContent = name;
  document.getElementById("listInfo").textContent = `${rows.length} command(s), inserting ` + (selected < 0 ? "at the end" : "above row " + (selected + 1));
  document.getElementById("delete").disabled = selected < 0;
  drawPoints();
}

/* Selecting a row copies it into its command block, so it can be read, changed
   and put back with Replace. */
function select(i) {
  selected = i;

  const row = rows[i];
  if (row && !row.raw) { setFields(byId(row.cmd), row.values); openBlock(byId(row.cmd).block); }
  renderRows();
}

function change() {
  dirty = true;
  renderRows();
}

function insertRow(cmd) {
  const values = getFields(cmd);
  const bad = checkFields(cmd, values);

  if (bad) { say(bad, true); return; }

  const at = selected < 0 ? rows.length : selected;
  rows.splice(at, 0, { cmd: cmd.id, values });
  if (selected >= 0) selected++;        /* the selected row moved down */
  if (cmd.point) point.lat = "";        /* the click is a row now */
  say("");
  change();
}

function replaceRow(cmd) {
  const row = rows[selected];
  const values = getFields(cmd);
  const bad = checkFields(cmd, values);

  if (!row) { say("Select a row to replace", true); return; }
  if (bad) { say(bad, true); return; }

  rows[selected] = { cmd: cmd.id, values };
  if (cmd.point) point.lat = "";
  say("");
  change();
}

/* Only the mow time comes from the fields; the corners stay as they are drawn. */
function replacePoly(cmd) {
  const row = rows[selected];
  const values = getFields(cmd);
  const bad = checkFields(cmd, values);

  if (!row || row.raw || row.cmd !== cmd.id) { say("Select a polygon row to replace", true); return; }
  if (bad) { say(bad, true); return; }

  row.values[0] = values[0];
  say("");
  change();
}

function deleteRow() {
  if (selected < 0) return;
  rows.splice(selected, 1);
  selected = Math.min(selected, rows.length - 1);
  change();
}

/* ------------------------------------------------------------- points -- */
/* Positions are stored the way the mower reports them, verbatim NMEA
   ddmm.mmmmm / dddmm.mmmmm, so nothing is lost converting back and forth. */

const nmea = (deg, digits) => {
  const d = Math.floor(Math.abs(deg));
  const m = (Math.abs(deg) - d) * 60;
  return String(d).padStart(digits, "0") + (m < 10 ? "0" : "") + m.toFixed(5);
};

const degrees = (value, hemi) => {
  const v = parseFloat(value);
  const d = Math.floor(v / 100);
  return (d + (v - d * 100) / 60) * (hemi === "S" || hemi === "W" ? -1 : 1);
};

const point = { lat: "", ns: "N", lon: "", ew: "E" };   /* the pending click */

function pointFields(latlng) {
  const values = [nmea(latlng.lat, 2), latlng.lat < 0 ? "S" : "N", nmea(latlng.lng, 3), latlng.lng < 0 ? "W" : "E"];

  setFields(byId(4), values);
  openBlock(byId(4).block);
  Object.assign(point, { lat: values[0], ns: values[1], lon: values[2], ew: values[3] });
  drawPoints();
}

/* cmd 7 and cmd 8 carry their own point list, so both are built from map clicks
   rather than from the fields: a polygon is mowtime, the centre to turn towards
   from outside, numpoints, then four fields per corner, and a line is numpoints,
   the target point, then four fields per point. The polygon centre starts at the
   average of its corners; the line targets the point clicked last. */

const PICK_MAX = 32;

const pick = { cmd: null, pts: [] };

const atLatLng = (v, i) => L.latLng(degrees(v[i], v[i + 1]), degrees(v[i + 2], v[i + 3]));

const polyCentre = pts => L.latLng(pts.reduce((a, p) => a + p.lat, 0) / pts.length, pts.reduce((a, p) => a + p.lng, 0) / pts.length);

const polyFields = ll => [nmea(ll.lat, 2), ll.lat < 0 ? "S" : "N", nmea(ll.lng, 3), ll.lng < 0 ? "W" : "E"];

function pickStart(cmd) {
  pick.cmd = pick.cmd === cmd ? null : cmd;
  pick.pts = [];
  say(pick.cmd ? `Click the ${cmd.poly ? "corners" : "points"} on the map, then Done` : "");
  drawPoints();
}

function pickClick(latlng) {
  pick.pts.push(latlng);
  say(`${pick.pts.length} point(s) picked, click Done when finished`);
  drawPoints();
}

function pickDone(cmd) {
  const min = cmd.poly ? 3 : 2;
  const n = pick.pts.length;
  const values = getFields(cmd);
  const bad = checkFields(cmd, values);

  if (pick.cmd !== cmd || n < min || n > PICK_MAX) { say(`Pick ${min} to ${PICK_MAX} points on the map first`, true); return; }
  if (bad) { say(bad, true); return; }

  const at = selected < 0 ? rows.length : selected;
  const fields = cmd.poly ? [values[0], ...polyFields(polyCentre(pick.pts)), String(n)] : [String(n), String(n)];

  for (const ll of pick.pts) fields.push(...polyFields(ll));
  rows.splice(at, 0, { cmd: cmd.id, values: fields });
  if (selected >= 0) selected++;
  pick.cmd = null;
  pick.pts = [];
  say("");
  change();
}

/* The selected polygon gets a handle on every corner and on its centre; the
   others are an outline with the centre marked. */
function drawPolygon(row, i) {
  const v = row.values;
  const pts = [];
  const centre = marker(atLatLng(v, 1), "c", "center", i === selected);

  for (let k = 0; k < +v[5]; k++) pts.push(atLatLng(v, 6 + k * 4));
  L.polygon(pts, { color: i === selected ? "#f9c74f" : "#43aa8b", weight: 2, opacity: .9, fillOpacity: .08 }).addTo(pathLayer);
  centre.on("dragend", () => {
    v.splice(1, 4, ...polyFields(centre.getLatLng()));
    change();
  });
  centre.addTo(pathLayer);
  if (i !== selected) return;

  pts.forEach((ll, k) => {
    const m = marker(ll, "", "on", true);

    m.on("dragend", () => {
      v.splice(6 + k * 4, 4, ...polyFields(m.getLatLng()));
      change();
    });
    m.addTo(pathLayer);
  });
}

/* The selected line gets a handle on every point, and clicking one makes it the
   target the mower drives to. The target is marked whether selected or not. */
function drawLine(row, i) {
  const v = row.values;
  const pts = [];

  for (let k = 0; k < +v[0]; k++) pts.push(atLatLng(v, 2 + k * 4));
  L.polyline(pts, { color: i === selected ? "#f9c74f" : "#43aa8b", weight: 2, opacity: .9 }).addTo(pathLayer);

  pts.forEach((ll, k) => {
    const m = marker(ll, k + 1, k + 1 === +v[1] ? "target" : "", i === selected);

    if (i === selected) {
      m.on("dragend", () => {
        v.splice(2 + k * 4, 4, ...polyFields(m.getLatLng()));
        change();
      });
      m.on("click", () => {
        v[1] = String(k + 1);
        change();
      });
    }
    m.addTo(pathLayer);
  });
}

function marker(latlng, text, cls, draggable) {
  return L.marker(latlng, {
    draggable,
    icon: L.divIcon({ className: "", iconSize: null, html: `<div class="marker ${cls}">${text}</div>` })
  });
}

function drawPoints() {
  const coords = [];

  pathLayer.clearLayers();

  rows.forEach((row, i) => {
    if (row.raw || row.cmd !== 4) return;

    const latlng = L.latLng(degrees(row.values[0], row.values[1]), degrees(row.values[2], row.values[3]));
    const m = marker(latlng, i + 1, i === selected ? "on" : "", true);

    coords.push(latlng);
    m.on("dragend", () => {
      const p = m.getLatLng();
      row.values = [nmea(p.lat, 2), p.lat < 0 ? "S" : "N", nmea(p.lng, 3), p.lng < 0 ? "W" : "E"];
      if (i === selected) setFields(byId(4), row.values);
      change();
    });
    m.addTo(pathLayer);
  });

  if (coords.length > 1) L.polyline(coords, { color: "#4cc9f0", weight: 2, opacity: .8, dashArray: "4 4" }).addTo(pathLayer);
  rows.forEach((row, i) => { if (!row.raw && row.cmd === 7) drawPolygon(row, i); });
  rows.forEach((row, i) => { if (!row.raw && row.cmd === 8) drawLine(row, i); });
  if (point.lat) marker(L.latLng(degrees(point.lat, point.ns), degrees(point.lon, point.ew)), "", "pending", false).addTo(pathLayer);
  pick.pts.forEach((ll, i) => marker(ll, i + 1, "pending", false).addTo(pathLayer));
  mow.pts.forEach((ll, i) => marker(ll, "p" + (i + 1), "pending", false).addTo(pathLayer));
}

map.on("click", e => mow.picking ? mowClick(e.latlng) : pick.cmd ? pickClick(e.latlng) : pointFields(e.latlng));

/* ----------------------------------------------------------- mow area -- */
/* Four corners clicked in order round the area. The mower drives p1-p2, steps
   sideways at the p2 end, drives back to a point one spacing further along
   p1-p4, steps sideways at the p1 end, and so on until a rail runs out. Every
   sideways step is turn 90, run, turn 90 the same way - the rows a hand
   written workorder would use, so nothing new is asked of the mower. */

const MOW_STEP_M = 0.20;
const MOW_RUN_SPEED = 30;
const MOW_TURN_SPEED = 0;      /* 0 turns on the spot, which is the exact 90 */
const MOW_TURN_TIMEOUT = 10;

const mow = { picking: false, pts: [] };

const M_PER_DEG = 111320;

const metres = (a, b) => Math.hypot((b.lat - a.lat) * M_PER_DEG,
                                    (b.lng - a.lng) * M_PER_DEG * Math.cos(a.lat * Math.PI / 180));

/* Degrees from north, clockwise, same convention as the mower. */
const bearing = (from, to) => Math.atan2((to.lng - from.lng) * Math.cos(from.lat * Math.PI / 180),
                                         to.lat - from.lat) * 180 / Math.PI;

/* "1" right, "0" left, whichever is the short way from heading round to want. */
const turnDir = (heading, want) => (((want - heading + 540) % 360) - 180) > 0 ? "1" : "0";

function along(from, to, d) {
  const len = metres(from, to);
  const f = len ? d / len : 0;

  return L.latLng(from.lat + (to.lat - from.lat) * f, from.lng + (to.lng - from.lng) * f);
}

function mowAreaRows([p1, p2, p3, p4]) {
  const out = [];
  const dirP2 = turnDir(bearing(p1, p2), bearing(p2, p3));   /* at the p2 end, towards p3 */
  const dirP1 = turnDir(bearing(p2, p1), bearing(p1, p4));   /* at the p1 end, towards p4 */
  const rails = Math.floor(Math.min(metres(p1, p4), metres(p2, p3)) / MOW_STEP_M);

  const addPoint = ll => out.push({ cmd: 4, values: [nmea(ll.lat, 2), ll.lat < 0 ? "S" : "N", nmea(ll.lng, 3), ll.lng < 0 ? "W" : "E"] });
  const addTurn = dir => {
    out.push({ cmd: 2, values: [String(MOW_TURN_SPEED), "90", dir, "0", "0"] });
    out.push({ cmd: 3, values: ["1", String(MOW_TURN_TIMEOUT)] });
  };
  const addStep = dir => {
    addTurn(dir);
    out.push({ cmd: 1, values: [String(MOW_RUN_SPEED), String(MOW_RUN_SPEED), "0", "0"] });
    out.push({ cmd: 3, values: ["0", "1"] });
    addTurn(dir);
  };

  addPoint(p1);
  addPoint(p2);
  for (let k = 1; k <= rails; k++) {
    addStep(dirP2);
    addPoint(along(p1, p4, k * MOW_STEP_M));
    addStep(dirP1);
    addPoint(along(p2, p3, k * MOW_STEP_M));
  }
  return out;
}

function mowClick(latlng) {
  mow.pts.push(latlng);
  if (mow.pts.length < 4) {
    say(`Mow area: click p${mow.pts.length + 1}`);
    drawPoints();
    return;
  }

  const made = mowAreaRows(mow.pts);
  const at = selected < 0 ? rows.length : selected;

  mow.picking = false;
  mow.pts = [];
  rows.splice(at, 0, ...made);
  if (selected >= 0) selected += made.length;
  say(`Mow area: ${made.length} rows added`);
  change();
}

function mowStart() {
  mow.picking = !mow.picking;
  mow.pts = [];
  say(mow.picking ? "Mow area: click p1" : "");
  drawPoints();
}

function buildMowArea() {
  const block = document.createElement("div");

  block.className = "cmd";
  block.innerHTML = `<h2>Mow area</h2>`
    + `<div class="field"><label>Row spacing</label><span>${MOW_STEP_M * 100} cm</span></div>`
    + `<div class="row"><button id="mowPick">Pick 4 corners</button></div>`;
  document.getElementById("commands").appendChild(block);
  document.getElementById("mowPick").addEventListener("click", mowStart);
  block.querySelector("h2").addEventListener("click", () => openBlock(block));
}

/* --------------------------------------------------------------- file -- */
/* Files live in workorder/ on this server: listed from its directory index,
   read with GET and written back with PUT. */

const WORKORDER_DIR = "workorder/";
const HEADER = "#version 1\n";

const loadDialog = document.getElementById("loadDialog");
const delDialog = document.getElementById("delDialog");

function setFile(name, text) {
  rows = [];
  selected = -1;
  fileName = name;
  dirty = false;
  point.lat = "";

  for (const line of (text || "").split("\n")) {
    const s = line.trim();
    const f = s.split(",");
    const cmd = byId(+f[0]);

    const want = cmd && cmd.poly ? 7 + 4 * (+f[6] || 0)
               : cmd && cmd.line ? 3 + 4 * (+f[1] || 0)
               : cmd && cmd.fields.length + 1;

    if (!s || s.startsWith("#")) continue;
    if (cmd && f.length === want) rows.push({ cmd: cmd.id, values: f.slice(1) });
    else rows.push({ raw: s });
  }
  renderRows();
}

const fileText = () => HEADER + rows.map(rowText).join("\n") + (rows.length ? "\n" : "");

const askDiscard = () => !dirty || confirm("The workorder has unsaved changes. Discard them?");

async function fileNames() {
  let text;
  try {
    const res = await fetch(WORKORDER_DIR, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    text = await res.text();
  } catch (e) {
    say("Workorder listing unavailable: " + e.message, true);
    return [];
  }

  const doc = new DOMParser().parseFromString(text, "text/html");
  const names = [...doc.querySelectorAll("a[href]")]
    .map(a => a.getAttribute("href"))
    .map(h => h ? decodeURIComponent(h.split("?")[0].split("/").pop()) : "")
    .filter(n => /^[A-Za-z0-9_-]+\.wo$/.test(n))
    .map(n => n.replace(/\.wo$/, ""));

  return [...new Set(names)].sort();
}

function loadItem(text, name) {
  const li = document.createElement("li");

  li.textContent = text;
  if (!name) li.className = "none";
  else li.addEventListener("click", () => { loadDialog.close(); loadFile(name); });
  return li;
}

async function loadOpen() {
  const list = document.getElementById("loadList");

  if (!askDiscard()) return;

  list.replaceChildren(loadItem("Listing …"));
  loadDialog.showModal();

  const names = await fileNames();
  if (!loadDialog.open) return;                /* cancelled while listing */

  list.replaceChildren(...(names.length ? names.map(n => loadItem(n, n))
                                        : [loadItem("No .wo files in " + WORKORDER_DIR)]));
}

async function loadFile(name) {
  try {
    const res = await fetch(WORKORDER_DIR + name + ".wo", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    setFile(name, await res.text());
    say(name + " loaded");
  } catch (e) {
    say("Cannot load " + name + ": " + e.message, true);
  }
}

/* Deleting is the one thing here that cannot be undone, so the names go past
   the user once more before the requests are sent. */
function delItem(name) {
  const li = document.createElement("li");

  li.innerHTML = `<label><input type="checkbox" value="${name}"><span></span></label>`;
  li.querySelector("span").textContent = name;
  return li;
}

async function delOpen() {
  const list = document.getElementById("delList");

  list.replaceChildren(loadItem("Listing …"));
  delDialog.showModal();

  const names = await fileNames();
  if (!delDialog.open) return;                 /* cancelled while listing */

  list.replaceChildren(...(names.length ? names.map(delItem)
                                        : [loadItem("No .wo files in " + WORKORDER_DIR)]));
  document.getElementById("delGo").disabled = !names.length;
}

async function delFiles() {
  const names = [...document.querySelectorAll("#delList input:checked")].map(c => c.value);
  let done = 0;

  if (!names.length) { say("Tick the workorders to delete", true); return; }
  if (!confirm("Delete " + names.join(", ") + "?")) return;

  delDialog.close();

  for (const name of names) {
    try {
      const res = await fetch(WORKORDER_DIR + name + ".wo", { method: "DELETE" });
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    } catch (e) {
      say(`Cannot delete ${name}: ${e.message} — the server must allow DELETE in ${WORKORDER_DIR}`, true);
      break;
    }
    /* The open file is now only in this browser: it needs a name again. */
    if (name === fileName) { fileName = ""; dirty = true; }
    done++;
  }

  if (done === names.length) say(done + " workorder(s) deleted");
  renderRows();
}

async function saveFile(name) {
  try {
    const res = await fetch(WORKORDER_DIR + name + ".wo", {
      method: "PUT", headers: { "Content-Type": "text/csv" }, body: fileText()
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
  } catch (e) {
    say("Cannot save " + name + ": " + e.message + " — the server must allow PUT in " + WORKORDER_DIR, true);
    return;
  }

  fileName = name;
  dirty = false;
  say(name + " saved");
  renderRows();
}

/* A copy in the browser's download folder; the server copy is untouched, so an
   unsaved workorder stays unsaved. */
function downloadFile() {
  const a = document.createElement("a");
  const url = URL.createObjectURL(new Blob([fileText()], { type: "text/csv" }));

  a.href = url;
  a.download = (fileName || "workorder") + ".wo";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);   /* the download reads it after the click */
  say(a.download + " downloaded");
}

function saveAs() {
  const name = prompt("Save workorder as", fileName || "");

  if (name === null) return;
  if (!/^[A-Za-z0-9_-]+$/.test(name)) { say("A workorder name may hold a-z A-Z 0-9 _- only", true); return; }
  saveFile(name);
}

/* ------------------------------------------------------------- events -- */

document.getElementById("new").addEventListener("click", () => {
  if (!askDiscard()) return;
  setFile("", "");
  say("");
});

document.getElementById("load").addEventListener("click", loadOpen);

document.getElementById("loadCancel").addEventListener("click", () => loadDialog.close());

document.getElementById("save").addEventListener("click", () => fileName ? saveFile(fileName) : saveAs());

document.getElementById("saveas").addEventListener("click", saveAs);

document.getElementById("download").addEventListener("click", downloadFile);

document.getElementById("del").addEventListener("click", delOpen);

document.getElementById("delGo").addEventListener("click", delFiles);

document.getElementById("delCancel").addEventListener("click", () => delDialog.close());

document.getElementById("delete").addEventListener("click", deleteRow);

addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });

/* ----------------------------------------------------------- start-up -- */

buildCommands();
buildMowArea();
setFile("", "");
loadLayers();
</script>
</body>
</html>
